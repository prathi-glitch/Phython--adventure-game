
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build APK
        run: |
          source venv/bin/activate
          set +e
          yes | buildozer android debug
          status=${PIPESTATUS[1]}
          exit "$status"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Python-Adventure-APK
          path: bin/*.apk
